<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0c10;
    --ink: #cfc8b8;
    --accent: #a8842f;
    --line: rgba(207,200,184,0.16);
    --card: #17151b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background:
      radial-gradient(ellipse at 50% 20%, rgba(168,132,47,0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  /* ==========================================================
     ✏️  EDITA AQUÍ TU CONTENIDO — todo lo demás es diseño
     Cambia el título, la pista bajo "clue" y el pie si quieres.
     ========================================================== */

  .box {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .seal-wrap { display: contents; }
  #seal {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 0 0 0 rgba(168,132,47,0);
  }
  #seal:hover {
    box-shadow: 0 0 22px 2px rgba(168,132,47,0.25);
  }
  #seal:active { transform: scale(0.96); }
  #seal.opened {
    opacity: 0;
    transform: scale(1.3);
    pointer-events: none;
  }
  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 14px;
    opacity: 0.85;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.02em;
    line-height: 1.3;
    margin: 0 0 22px;
  }
  #clue {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.9s ease, opacity 0.9s ease 0.15s;
  }
  #clue.shown {
    max-height: 400px;
    opacity: 1;
  }
  .clue-text {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 4px;
    font-size: 15.5px;
    line-height: 1.75;
  }
  .note {
    margin-top: 22px;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0.4;
  }
  #hint {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink);
    opacity: 0.45;
    margin-top: -4px;
  }
</style>
</head>
<body>

  <div class="box">
    <p class="eyebrow">— sala 04 —</p>

    <!-- Título de la pista -->
    <h1>Algo se esconde<br>bajo la tercera tabla</h1>

    <button id="seal" onclick="reveal()">ROMPER<br>SELLO</button>
    <p id="hint">toca el sello</p>

    <div id="clue">
      <div class="clue-text">
        <!-- Aquí va el texto de la pista real -->
        La respuesta que buscas nunca miente,<br>
        pero tampoco dice toda la verdad.<br>
        Cuenta las velas. Ese número es la puerta.
      </div>
    </div>

    <p class="note">no lo compartas en voz alta</p>
  </div>

  <script>
    function reveal() {
      document.getElementById('seal').classList.add('opened');
      document.getElementById('hint').style.display = 'none';
      document.getElementById('clue').classList.add('shown');
    }
  </script>

</body>
</html>
